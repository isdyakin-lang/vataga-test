<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VATAGA - Участник: Илья Дякин - Личные проекты</title> 
    
    <!-- Подключение оригинальных шрифтов: League Spartan и Montserrat с Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@900&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* Локальное подключение Caviar Dreams (устраняет сбросы шрифта) */
        @font-face {
            font-family: 'Caviar Dreams';
            src: url('fonts/CaviarDreams.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Caviar Dreams';
            src: url('fonts/CaviarDreams_Bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body { 
            font-family: 'Caviar Dreams', 'Montserrat', sans-serif; 
            background-color: #f7f7f7; 
            color: #000000;            
            overflow-x: hidden; 
            padding-top: 235px;
        }
        body.no-scroll {
            overflow: hidden !important;
        }

        /* На ПК скрываем курсор, на мобильных оставляем стандартный */
        @media (min-width: 769px) {
            html, body, * { 
                cursor: none !important; 
                user-select: none; 
            }
        }

        @media (max-width: 768px) {
            .cursor-circle {
                display: none !important;
            }
        }

        /* Оверлей шума */
        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 900; opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
        
        /* Блюр заднего фона при открытии микро-меню */
        .page-blur-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 680;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(247, 247, 247, 0.3);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        body.menu-open .page-blur-overlay {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* Блюр под шапкой */
        .header-blur-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 235px;
            z-index: 608;
            pointer-events: none;
            background: linear-gradient(to bottom, 
                                rgba(247, 247, 247, 0.95) 0%,
                                rgba(247, 247, 247, 0.95) 62%,
                                rgba(247, 247, 247, 0.4) 85%,
                                rgba(247, 247, 247, 0.0) 100%);
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px); 
            mask-image: linear-gradient(to bottom, 
                                black 0%,
                                black 62%,
                                rgba(0,0,0,0.6) 90%,
                                transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, 
                                        black 0%, 
                                        black 62%, 
                                        rgba(0,0,0,0.6) 90%,
                                        transparent 100%);
        }

        /* Логотип */
        .logo {
            position: fixed; top: 40px; left: 50px;
            font-family: 'League Spartan', sans-serif;
            font-size: 32px; 
            font-weight: 900; 
            text-transform: uppercase; 
            color: #000000;
            text-decoration: none;
            z-index: 650; 
            transition: color 0.3s, transform 0.3s;
        }

        .logo:hover {
            color: #000000; 
            transform: scale(1.05);
        }

        /* Меню навигации (Десктоп) */
        nav.top-menu {
            position: fixed; top: 40px; right: 50px;
            display: flex; flex-direction: row; gap: 40px; 
            z-index: 700; 
            transition: opacity 0.3s ease;
        }

        nav.top-menu a {
            font-family: 'Caviar Dreams', 'Montserrat', sans-serif;
            color: #000000; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 18px; 
            transition: color 0.3s, transform 0.3s, opacity 0.3s;
            white-space: nowrap;
            opacity: 0.8;
        }

        nav.top-menu a:hover {
            color: #000000; 
            opacity: 1;
            transform: scale(1.05);
        }
        
        nav.top-menu a.active {
            font-weight: bold; 
            opacity: 1;
        }

        /* Субменю участника (Десктоп) */
        nav.member-sub-menu {
            position: fixed;
            top: 120px; 
            right: 50px; 
            display: flex;
            flex-direction: row;
            gap: 40px; 
            z-index: 609; 
        }
        nav.member-sub-menu a {
            color: #000000; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 18px; 
            transition: color 0.3s, transform 0.3s;
            white-space: nowrap; 
        }
        nav.member-sub-menu a:hover {
            color: #000000; 
            transform: scale(1.05);
        }
        nav.member-sub-menu a.active-sub-menu-item { 
            font-weight: bold;
            border-bottom: 2px solid #000000;
        }

        /* Мобильная кнопка меню (Бургер) */
        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 750;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 10px;
            flex-direction: column;
            justify-content: space-between;
            width: 40px;
            height: 32px;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-menu-toggle span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: #000000;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .mobile-menu-toggle.active span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }
        .mobile-menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }
        .mobile-menu-toggle.active span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        /* Контейнер контента */
        .content-container {
            position: relative;
            z-index: 600; 
            margin: 0 auto 100px auto;
            max-width: 1200px;
            padding: 0 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 70px;
            justify-items: center; 
            align-items: center; 
            max-width: none; 
            width: 100%;
        }

        .project-item {
            display: flex;
            flex-direction: column;
            align-items: center; 
            text-align: center;
            width: 100%; 
            cursor: pointer; 
        }

        .project-button {
            position: relative;
            display: block; 
            width: 100%; 
            max-width: 250px; 
            height: 180px; 
            border-radius: 8px; 
            margin-bottom: 8px; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
            text-decoration: none; 
            color: inherit; 
            overflow: hidden;
        }
        
        /* ИСПРАВЛЕНИЕ: Абсолютное позиционирование картинки внутри кнопки */
        .project-button img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: filter 0.3s ease;
        }

        .project-button::before { 
            content: '';
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #f7f7f7;
            opacity: 0;
            pointer-events: none;
            z-index: 2;
            border-radius: 8px;
            transition: opacity 0.3s ease;
        }
        
        .project-item.is-fogged .project-button::before {
            opacity: 0.85;
        }
        .project-item.is-fogged .project-button img {
            filter: blur(4px);
        }

        .project-button:hover {
            transform: scale(1.04); 
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1); 
        }

        .project-title {
            font-size: 14px; 
            font-weight: normal; 
            color: #888888; 
            opacity: 0; 
            text-align: left; 
            width: 100%; 
            max-width: 250px; 
            padding-left: 5px; 
            transition: opacity 0.3s ease, font-weight 0.3s ease; 
        }

        .project-item:hover .project-title, .project-title.active {
            opacity: 1; 
            font-weight: 600; 
            color: #000000;
        }

        /* Интерактивный туман */
        .fog-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(6px); 
            -webkit-backdrop-filter: blur(6px);
            z-index: 500; 
            pointer-events: none; 
            mask-composite: intersect; 
            -webkit-mask-composite: source-in;
            transition: background 0.5s linear, backdrop-filter 0.5s linear, -webkit-backdrop-filter 0.5s linear; 
        }

        .cursor-circle { 
            position: fixed; top: 0; left: 0; 
            width: 20px; height: 20px; 
            border: 2px solid #000000; border-radius: 50%; 
            pointer-events: none; transform: translate(-50%, -50%); 
            z-index: 999999; 
        }
        
        .figure {
            position: fixed; top: 0; left: 0; 
            pointer-events: none;
            z-index: 605; 
            transition: opacity 0.5s;
        }
        
        .figure img { width: 100%; height: 100%; object-fit: contain; }

        /* --- МОБИЛЬНАЯ АДАПТАЦИЯ (Медиазапросы) --- */
        @media (max-width: 1024px) {
            .projects-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 50px;
            }
            .project-button,
            .project-title {
                max-width: 220px;
            }
            .header-blur-background {
                height: 235px;
            }
        }
        @media (max-width: 768px) {
            body { padding-top: 190px; }
            .logo { top: 25px; left: 20px; font-size: 26px; }
            
            .mobile-menu-toggle {
                display: flex;
            }

            /* Компактное МИКРО-МЕНЮ справа вверху с блюром */
            nav.top-menu {
                position: fixed;
                top: 70px;
                right: 25px;
                width: auto;
                min-width: 180px;
                height: auto;
                background-color: rgba(255, 255, 255, 0.95);
                border: 1px solid rgba(0, 0, 0, 0.08);
                border-radius: 12px;
                padding: 18px 22px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
                flex-direction: column;
                justify-content: flex-start;
                align-items: flex-end;
                gap: 14px;
                opacity: 0;
                visibility: hidden;
                transform: translateY(-10px);
                transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
                z-index: 700;
            }

            nav.top-menu.mobile-open {
                opacity: 1;
                visibility: visible;
                transform: translateY(0);
                pointer-events: auto !important;
            }

            nav.top-menu a {
                font-size: 19px;
                font-weight: bold;
                text-align: right;
                display: block;
                padding: 2px 0;
                pointer-events: auto !important;
            }

            /* Горизонтальное центрированное субменю */
            nav.member-sub-menu {
                position: fixed;
                top: 85px; 
                left: 0;
                width: 100vw;
                padding: 10px 15px;
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                gap: 10px 20px; 
                z-index: 609; 
                background: transparent;
            }
            nav.member-sub-menu a {
                font-size: 14px; 
            }

            .header-blur-background { height: 165px; }
            
            .projects-grid {
                grid-template-columns: repeat(2, 1fr); 
                gap: 30px 20px;
                margin-top: 20px;
            }
            .project-button {
                width: 100%;
                max-width: none;
                height: 0;
                padding-bottom: 72%;
            }
            .project-title {
                width: 100%;
                max-width: none;
                opacity: 0.9;
                font-size: 13px;
                text-align: left;
                margin-top: 4px;
            }
        }
        @media (max-width: 480px) {
            body {
                padding-top: 170px;
            }
            nav.member-sub-menu {
                top: 75px;
                gap: 8px 12px;
            }
            nav.member-sub-menu a {
                font-size: 13px;
            }
            .projects-grid {
                grid-template-columns: 1fr; 
                gap: 25px;
            }
            .project-button {
                padding-bottom: 72%;
            }
            .header-blur-background { height: 150px; }
        }
    </style>
</head>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const circle = document.getElementById('circle');
        const fog = document.getElementById('fog');
        const menuToggle = document.getElementById('menuToggle');
        const topMenu = document.getElementById('topMenu');
        const blurOverlay = document.getElementById('blurOverlay');
        const body = document.body;

        // Оптимизация для мобильных устройств
        const isMobile = window.matchMedia('(max-width: 768px)').matches;
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        let clusterX = mouseX + window.scrollX, clusterY = mouseY + window.scrollY; 
        let time = 0; 
        
        let isWakingUp = true; 
        let currentHoleRadius = 250; 
        let targetHoleRadius = 250;

        function toggleMenu() {
            menuToggle.classList.toggle('active');
            topMenu.classList.toggle('mobile-open');
            body.classList.toggle('menu-open');
        }

        menuToggle.addEventListener('click', toggleMenu);
        blurOverlay.addEventListener('click', toggleMenu);

        if (fog) fog.classList.add('waking-up'); 

        function updatePointerPosition(clientX, clientY) {
            mouseX = clientX; 
            mouseY = clientY;
            if (circle) circle.style.transform = `translate(calc(${mouseX}px - 50%), calc(${mouseY}px - 50%))`;
        }

        document.addEventListener('mousemove', (e) => updatePointerPosition(e.clientX, e.clientY));
        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                updatePointerPosition(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        const figureImageFiles = [
            'images/hero1.png', 'images/hero2.png', 'images/hero3.png',
            'images/hero4.png', 'images/hero5.png', 'images/hero6.png',
            'images/hero7.png', 'images/hero8.png'
        ];
        
        // На мобильных рисуем только 5 фигурок для экономии ресурсов
        const activeFiles = isMobile ? figureImageFiles.slice(0, 5) : figureImageFiles;
        const figures = []; 

        for (let i = 0; i < activeFiles.length; i++) {
            const imgFileName = activeFiles[i];
            const imgCode = `<img src="${imgFileName}" alt="fig" loading="lazy">`;

            let el = document.createElement('div');
            el.className = 'figure';
            el.innerHTML = imgCode; 
            document.body.appendChild(el); 

            let size = 25 + Math.random() * 20; 
            el.style.width = size + 'px'; el.style.height = size + 'px';
            let baseOpacity = 0.5 + Math.random() * 0.5; 
            el.style.opacity = baseOpacity;

            figures.push({
                element: el,
                x: Math.random() * window.innerWidth + window.scrollX, 
                y: Math.random() * window.innerHeight + window.scrollY,
                offsetX: (Math.random() - 0.5) * 40, 
                offsetY: (Math.random() - 0.5) * 40,
                speed: 0.03 + Math.random() * 0.03, 
                jumpPhase: Math.random() * Math.PI * 2,
                state: 'follow', 
                dropX: 0, 
                dropY: 0,
                baseOpacity: baseOpacity,
                direction: 1,
                claimedItemTitle: null 
            });
        }

        document.addEventListener('mousedown', (e) => {
            if (e.target.closest('a') || e.target.closest('button') || e.target.closest('.mobile-menu-toggle') || e.target.closest('nav.top-menu') || e.target.closest('nav.member-sub-menu')) {
                return;
            }

            let targetItemTitle = null;
            const projectItemTitle = e.target.closest('.project-item .project-title'); 
            if (projectItemTitle) {
                targetItemTitle = projectItemTitle;
            }
            
            let followers = figures.filter(f => f.state === 'follow');
            if (followers.length > 0) {
                let randomFig = followers[Math.floor(Math.random() * followers.length)];
                
                randomFig.state = 'dropped';
                randomFig.dropX = e.clientX + window.scrollX; 
                randomFig.dropY = e.clientY + window.scrollY;
                randomFig.element.style.opacity = 1; 

                if (targetItemTitle) {
                    targetItemTitle.classList.add('active');
                    randomFig.claimedItemTitle = targetItemTitle; 
                }

                setTimeout(() => {
                    randomFig.state = 'follow'; 
                    randomFig.element.style.opacity = randomFig.baseOpacity; 
                    
                    if (randomFig.claimedItemTitle) {
                        randomFig.claimedItemTitle.classList.remove('active');
                        randomFig.claimedItemTitle = null; 
                    }
                }, 4000 + Math.random() * 2000); 
            }
        });

        // Контроль фокуса вкладки для сохранения ресурсов батареи
        let rafId = null;
        let isTabVisible = true;
        document.addEventListener('visibilitychange', () => {
            isTabVisible = document.visibilityState === 'visible';
            if (isTabVisible && rafId === null) {
                rafId = requestAnimationFrame(animate);
            }
        });

        function animate() {
            time += 0.08; 
            currentHoleRadius += (targetHoleRadius - currentHoleRadius) * 0.05;

            let targetClusterX = mouseX + window.scrollX;
            let targetClusterY = mouseY + window.scrollY;

            let dx = targetClusterX - clusterX;
            let dy = targetClusterY - clusterY;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 0) {
                const clusterOffset = 35;
                clusterX += (targetClusterX - (dx / dist) * clusterOffset - clusterX) * 0.4;
                clusterY += (targetClusterY - (dy / dist) * clusterOffset - clusterY) * 0.4;
            }

            let maskLayers = [];
            if (currentHoleRadius > 1) {
                maskLayers.push(`radial-gradient(circle ${currentHoleRadius}px at ${mouseX}px ${mouseY}px, transparent 0%, transparent 15%, rgba(0,0,0,0.6) 45%, black 100%)`);
            } else {
                maskLayers.push(`linear-gradient(black, black)`); 
            }

            figures.forEach(fig => {
                let oldX = fig.x; 
                let finalTransform = '';

                if (fig.state === 'follow') {
                    let targetFigX = clusterX + fig.offsetX;
                    let targetFigY = clusterY + fig.offsetY;

                    fig.x += (targetFigX - fig.x) * fig.speed;
                    fig.y += (targetFigY - fig.y) * fig.speed;
                    
                    fig.element.style.position = 'fixed'; 
                    fig.element.style.left = '0'; 
                    fig.element.style.top = '0';  
                    
                    // Деликатное покачивание 4px вместо 25px
                    let bounceY = (isWakingUp && !prefersReducedMotion) ? Math.sin(time + fig.jumpPhase) * 4 : 0; 
                    finalTransform = `translate(calc(${fig.x - window.scrollX}px - 50%), calc(${fig.y - window.scrollY + bounceY}px - 50%)) scaleX(${fig.direction})`;

                } else {
                    let targetFigX = fig.dropX; 
                    let targetFigY = fig.dropY;

                    fig.x += (targetFigX - fig.x) * fig.speed; 
                    fig.y += (targetFigY - fig.y) * fig.speed;
                    
                    fig.element.style.position = 'absolute'; 
                    fig.element.style.left = '0'; 
                    fig.element.style.top = '0';  

                    finalTransform = `translate(calc(${fig.x}px - 50%), calc(${fig.y}px - 50%)) scaleX(${fig.direction})`;

                    maskLayers.push(`radial-gradient(circle 350px at ${fig.x - window.scrollX}px ${fig.y - window.scrollY}px, transparent 0%, transparent 50%, rgba(0,0,0,0.3) 75%, black 100%)`);
                }

                let deltaX = fig.x - oldX;
                if (Math.abs(deltaX) > 0.3) fig.direction = deltaX > 0 ? 1 : -1;
                
                fig.element.style.transform = finalTransform; 
            });

            if (fog) {
                let maskString = maskLayers.join(', ');
                fog.style.webkitMaskImage = maskString;
                fog.style.maskImage = maskString;
            }

            rafId = requestAnimationFrame(animate);
        }
        
        rafId = requestAnimationFrame(animate);

        // Эффект затуманивания других проектов при ховере
        const allFoggedItems = Array.from(document.querySelectorAll('.project-item')).filter(item => item !== null); 

        allFoggedItems.forEach(item => {
            item.addEventListener('mouseenter', () => {
                allFoggedItems.forEach(otherItem => {
                    if (otherItem !== item) { 
                        otherItem.classList.add('is-fogged');
                    }
                });
            });

            item.addEventListener('mouseleave', () => {
                allFoggedItems.forEach(otherItem => {
                    otherItem.classList.remove('is-fogged'); 
                });
            });
        });
    }); 
    </script>
</body>
