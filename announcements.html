<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VATAGA - Анонсы</title>

    <!-- Подключение оригинальных шрифтов: League Spartan и Montserrat с Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@900&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* Локальное подключение Caviar Dreams */
        @font-face {
            font-family: 'Caviar Dreams';
            src: url('fonts/CaviarDreams.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Caviar Dreams';
            src: url('fonts/CaviarDreams_Bold.woff2') format('woff2');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            font-family: 'Caviar Dreams', 'Montserrat', sans-serif;
            background: #f7f7f7;
            color: #000;
            overflow-x: hidden;
            padding-top: 150px;
        }

        body.no-scroll {
            overflow: hidden !important;
        }

        /* На ПК скрываем курсор, на мобильных оставляем стандартный */
        @media (min-width: 769px) {
            html, body, * {
                cursor: none !important;
                user-select: none;
            }
        }

        @media (max-width: 768px) {
            .cursor-circle {
                display: none !important;
            }
        }

        /* Оверлей шума */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 900;
            opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Блюр заднего фона при открытии микро-меню */
        .page-blur-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 680;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(247, 247, 247, 0.3);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        body.menu-open .page-blur-overlay {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* Размытие под шапкой при скролле */
        .header-blur-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 130px;
            z-index: 608;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(247, 247, 247, 0.95) 0%,
                rgba(247, 247, 247, 0.95) 75%,
                rgba(247, 247, 247, 0.4) 90%,
                rgba(247, 247, 247, 0) 100%
            );
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            mask-image: linear-gradient(
                to bottom,
                black 0%,
                black 75%,
                rgba(0, 0, 0, 0.6) 90%,
                transparent 100%
            );
            -webkit-mask-image: linear-gradient(
                to bottom,
                black 0%,
                black 75%,
                rgba(0, 0, 0, 0.6) 90%,
                transparent 100%
            );
        }

        /* Логотип */
        .logo {
            position: fixed;
            top: 40px;
            left: 50px;
            font-family: 'League Spartan', sans-serif;
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            color: #000;
            text-decoration: none;
            z-index: 650;
            transition: transform 0.3s, color 0.3s;
        }

        .logo:hover {
            color: #000;
            transform: scale(1.05);
        }

        /* Меню навигации (Десктоп) */
        nav.top-menu {
            position: fixed;
            top: 40px;
            right: 50px;
            display: flex;
            gap: 40px;
            z-index: 700;
            transition: opacity 0.3s ease;
        }

        nav.top-menu a {
            font-family: 'Caviar Dreams', 'Montserrat', sans-serif;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.3s, opacity 0.3s, color 0.3s;
            white-space: nowrap;
            opacity: 0.8;
        }

        nav.top-menu a:hover {
            color: #000;
            transform: scale(1.05);
            opacity: 1;
        }

        nav.top-menu a.active {
            font-weight: bold;
            opacity: 1;
        }

        /* Мобильная кнопка меню (Бургер) */
        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 750;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 10px;
            flex-direction: column;
            justify-content: space-between;
            width: 40px;
            height: 32px;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-menu-toggle span {
            display: block;
            width: 100%;
            height: 2px;
            background: #000;
            transition: transform 0.3s, opacity 0.3s;
        }

        .mobile-menu-toggle.active span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }

        .mobile-menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }

        .mobile-menu-toggle.active span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        /* Контент */
        .content-container {
            position: relative;
            z-index: 600;
            max-width: 1200px;
            margin: 10px auto 100px;
            padding: 0 50px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .upcoming-events-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 60px;
            justify-content: center;
            align-items: flex-start;
        }

        /* Текущее мероприятие */
        .current-event-section {
            flex-grow: 1;
            max-width: 780px;
            min-width: 300px;
        }

        .current-event-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            padding: 30px;
            display: flex;
            flex-direction: row;
            gap: 50px;
            align-items: flex-start;
        }

        .current-event-poster {
            flex-shrink: 0;
            width: 280px;
            height: 373px;
            border-radius: 8px;
            overflow: hidden;
            background: #e0e0e0;
        }

        .current-event-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .current-event-details {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            color: #444;
            font-size: 1.1em;
            line-height: 1.6;
            padding-top: 5px;
        }

        .current-event-details h2 {
            font-size: 1.8em;
            font-weight: normal;
            color: #000;
            margin: 0 0 20px;
        }

        .event-date-time {
            font-size: 1.2em;
            font-weight: bold;
            color: #000;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .event-description {
            margin-bottom: 30px;
        }

        .register-button {
            display: inline-block;
            padding: 12px 25px;
            background: #000;
            color: #f7f7f7;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1em;
            transition: transform 0.3s, background 0.3s;
        }

        .register-button:hover {
            background: #333;
            transform: translateY(-2px);
        }

        /* Следующее мероприятие */
        .next-event-section {
            flex-shrink: 0;
            width: 280px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .next-event-section h3 {
            font-size: 0.9em;
            font-weight: 600;
            color: #000;
            margin: 0 0 10px;
        }

        .next-event-poster {
            width: 100%;
            height: 345px;
            border-radius: 6px;
            overflow: hidden;
            background: #e0e0e0;
            margin-bottom: 10px;
        }

        .next-event-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .next-event-details {
            width: 100%;
            color: #000;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .next-event-details h4 {
            font-size: 0.95em;
            font-weight: bold;
            color: #000;
            margin: 0;
        }

        /* Предыдущие мероприятия */
        .previous-events-section {
            width: 100%;
        }

        .section-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #000;
            text-align: left;
            width: 100%;
            margin: 0 0 25px;
        }

        .accordion {
            width: 100%;
            max-width: 900px;
        }

        .accordion-item {
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            transition: box-shadow 0.3s;
        }

        .accordion-item:hover {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        }

        .accordion-header {
            width: 100%;
            padding: 18px 45px 18px 25px;
            background: transparent;
            border: none;
            text-align: left;
            font-family: 'Caviar Dreams', 'Montserrat', sans-serif;
            font-size: 1.1em;
            font-weight: bold;
            color: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            cursor: pointer;
        }

        .accordion-header:hover {
            background: #f0f0f0;
        }

        .accordion-header::after {
            content: '›';
            font-size: 1.5em;
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%) rotate(90deg);
            transition: transform 0.3s;
        }

        .accordion-header.active::after {
            transform: translateY(-50%) rotate(-90deg);
        }

        .event-title {
            flex-grow: 1;
            margin-right: 20px;
        }

        .event-date {
            font-size: 0.9em;
            color: #888;
            white-space: nowrap;
            flex-shrink: 0;
            margin-left: 15px;
        }

        .accordion-content {
            padding: 0 25px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, padding 0.4s ease-out;
            color: #555;
            line-height: 1.5;
        }

        .accordion-content.active {
            max-height: 500px;
            padding: 15px 25px 20px;
        }

        .event-content-wrapper {
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        .event-image-small {
            flex-shrink: 0;
            width: 90px;
            height: 120px;
            border-radius: 6px;
            overflow: hidden;
            background: #e0e0e0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .event-image-small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .event-text-wrapper {
            flex-grow: 1;
        }

        .event-summary {
            margin-top: 0;
            margin-bottom: 15px;
        }

        .read-more {
            display: inline-block;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
        }

        .read-more:hover {
            color: #555;
        }

        /* Туман */
        .fog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 500;
            pointer-events: none;
        }

        /* Курсор */
        .cursor-circle {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            border: 2px solid #000;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 999999;
        }

        /* Фигурки */
        .figure {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 605;
            transition: opacity 0.5s;
        }

        .figure img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* --- МОБИЛЬНАЯ АДАПТАЦИЯ --- */
        @media (max-width: 900px) {
            .upcoming-events-container {
                flex-direction: column;
                align-items: center;
            }

            .current-event-section {
                max-width: 100%;
                width: 100%;
                margin-bottom: 30px;
            }

            .current-event-card {
                flex-direction: column;
                align-items: center;
                gap: 25px;
                padding: 20px;
            }

            .current-event-poster {
                width: 220px;
                height: 293px;
            }

            .current-event-details {
                text-align: center;
                padding-top: 0;
            }

            .event-date-time {
                align-items: center;
            }

            .next-event-section {
                width: 100%;
                max-width: 360px;
                margin-bottom: 30px;
            }

            .next-event-poster {
                height: auto;
                aspect-ratio: 3 / 4;
            }
        }

        @media (max-width: 768px) {
            body {
                padding-top: 110px;
            }

            .logo {
                top: 25px;
                left: 20px;
                font-size: 26px;
            }

            .mobile-menu-toggle {
                display: flex;
            }

            /* Компактное МИКРО-МЕНЮ справа вверху */
            nav.top-menu {
                position: fixed;
                top: 70px;
                right: 25px;
                width: auto;
                min-width: 180px;
                height: auto;
                background-color: rgba(255, 255, 255, 0.95);
                border: 1px solid rgba(0, 0, 0, 0.08);
                border-radius: 12px;
                padding: 18px 22px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
                flex-direction: column;
                justify-content: flex-start;
                align-items: flex-end;
                gap: 14px;
                opacity: 0;
                visibility: hidden;
                transform: translateY(-10px);
                transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
                z-index: 700;
            }

            nav.top-menu.mobile-open {
                opacity: 1;
                visibility: visible;
                transform: translateY(0);
                pointer-events: auto !important;
            }

            nav.top-menu a {
                font-size: 19px;
                font-weight: bold;
                text-align: right;
                display: block;
                padding: 2px 0;
                pointer-events: auto !important;
            }

            .content-container {
                padding: 0 20px;
                margin-top: 10px;
            }

            .current-event-poster {
                width: 200px;
                height: 266px;
            }

            .current-event-details h2 {
                font-size: 1.4em;
            }

            .event-date-time {
                font-size: 1.05em;
            }

            .accordion-header {
                font-size: 0.95em;
                padding: 15px 35px 15px 15px;
            }

            .accordion-content.active {
                padding: 10px 15px 15px;
            }

            .event-content-wrapper {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }

            .event-image-small {
                width: 130px;
                height: 173px;
            }

            .event-text-wrapper {
                text-align: center;
            }

            .header-blur-background {
                height: 100px;
            }
        }

        @media (max-width: 480px) {
            .current-event-poster {
                width: 180px;
                height: 240px;
            }

            .current-event-details h2 {
                font-size: 1.25em;
            }

            .event-date-time {
                font-size: 0.95em;
            }

            .accordion-header {
                font-size: 0.9em;
                padding: 12px 30px 12px 12px;
            }

            .event-image-small {
                width: 110px;
                height: 146px;
            }
        }
    </style>
</head>

<body>

    <button class="mobile-menu-toggle" id="menuToggle" aria-label="Открыть меню">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="page-blur-overlay" id="blurOverlay"></div>

    <nav class="top-menu" id="topMenu">
        <a href="projects.html">Проекты</a>
        <a href="members.html">Участники</a>
        <a href="archive.html">Архив</a>

        <a href="announcements.html" class="active">Анонсы</a>
    </nav>

    <div class="header-blur-background"></div>

    <div class="content-container">
        <div class="upcoming-events-container">

    <div class="fog-overlay" id="fog"></div>
    <div class="noise-overlay"></div>
    <div class="cursor-circle" id="circle"></div>

    <script>

            /* =========================
               МОБИЛЬНОЕ МЕНЮ

                body.classList.toggle('menu-open');

            menuToggle.addEventListener('click', toggleMenu);

            /* =========================
               МЕРОПРИЯТИЯ ДАННЫЕ
            ========================= */
            const allEventsData = [

                {

                {

                    summary: 'Подробности о концепции и создании нашего выставочного стенда на АРХ Москва.',
                    poster_large: 'images/announcements/arch-moscow-stand-20250524.jpg',
                    poster_small: 'images/announcements/arch-moscow-stand-20250524.jpg',
                    link: '#'
                },
                {
                    id: 'event-pasta-bridges-20250908',
                    title: 'Лекция-знакомство и воркшоп "Мосты из макарон"',

            /* =========================
               РАБОТА С ДАТАМИ
            ========================= */
            function parseEventDate(event) {
                return new Date(`${event.date}T${event.time}:00`);
            }

            function formatDate(dateObj) {
                return dateObj.toLocaleDateString('ru-RU', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });
            }

            /* =========================
               РАЗДЕЛЕНИЕ СОБЫТИЙ
            ========================= */
            function categorizeEvents(events) {
                const now = new Date();
                const upcoming = [];
                const past = [];

                events.forEach(event => {
                    const eventDateTime = parseEventDate(event);
                    if (eventDateTime > now) {
                        upcoming.push(event);
                    } else {
                        past.push(event);
                    }
                });

                upcoming.sort((a, b) => parseEventDate(a) - parseEventDate(b));
                past.sort((a, b) => parseEventDate(b) - parseEventDate(a));

                return {
                    currentEvent: upcoming[0] || null,
                    nextEvent: upcoming[1] || null,
                    previousEvents: past
                };
            }

            /* =========================
               ТЕКУЩЕЕ МЕРОПРИЯТИЕ
            ========================= */
            function renderCurrentEvent(event) {
                if (!event) return '';
                const eventDateTime = parseEventDate(event);

                return `
                    <div class="current-event-card">
                        <div class="current-event-poster">
                            <img src="${event.poster_large}" alt="Постер мероприятия">
                        </div>
                        <div class="current-event-details">
                            <h2>${event.title}</h2>
                            <p class="event-date-time">
                                <span class="date">${formatDate(eventDateTime)}</span>
                                <span class="time">${event.time} МСК</span>
                            </p>
                            <p class="event-description">${event.description}</p>
                            <a href="${event.link}" class="register-button">Зарегистрироваться</a>
                        </div>
                    </div>
                `;
            }

            /* =========================
               СЛЕДУЮЩЕЕ МЕРОПРИЯТИЕ
            ========================= */
            function renderNextEvent(event) {
                if (!event) return '';

                return `
                    <h3>Запланированное</h3>
                    <div class="next-event-poster">
                        <img src="${event.poster_small}" alt="Постер следующего мероприятия">
                    </div>
                    <div class="next-event-details">
                        <h4>${event.title}</h4>
                    </div>
                `;
            }

            /* =========================
               АККОРДЕОН ITEM
            ========================= */
            function renderAccordionItem(event, isOpen = false) {
                const eventDateTime = parseEventDate(event);

                return `
                    <div class="accordion-item" id="event-${event.id}">
                        <button class="accordion-header ${isOpen ? 'active' : ''}">
                            <span class="event-title">${event.title}</span>
                            <span class="event-date">${formatDate(eventDateTime)}</span>
                        </button>
                        <div class="accordion-content ${isOpen ? 'active' : ''}">
                            <div class="event-content-wrapper">
                                <div class="event-image-small">
                                    <img src="${event.poster_small}" alt="Постер мероприятия">
                                </div>
                                <div class="event-text-wrapper">
                                    <p class="event-summary">${event.summary}</p>
                                    <a href="${event.link}" class="read-more">Подробнее</a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            /* =========================
               ОТРИСОВКА ВСЕХ СЕКЦИЙ
            ========================= */
            function renderAnnouncements() {
                const { currentEvent, nextEvent, previousEvents } = categorizeEvents(allEventsData);

                const currentSection = document.getElementById('current-event-section-dynamic');
                const nextSection = document.getElementById('next-event-section-dynamic');
                const accordion = document.getElementById('accordion-dynamic');
                const prevTitle = document.querySelector('.previous-events-section .section-title');

                currentSection.innerHTML = '';
                currentSection.style.display = 'none';

                nextSection.innerHTML = '';
                nextSection.style.display = 'none';

                accordion.innerHTML = '';
                prevTitle.style.display = 'none';

                if (currentEvent) {
                    currentSection.innerHTML = renderCurrentEvent(currentEvent);
                    currentSection.style.display = 'flex';
                }

                if (nextEvent) {
                    nextSection.innerHTML = renderNextEvent(nextEvent);
                    nextSection.style.display = 'flex';
                }

                if (previousEvents.length > 0) {
                    prevTitle.style.display = 'block';
                    previousEvents.forEach((event, index) => {
                        accordion.innerHTML += renderAccordionItem(event, index === 0);
                    });
                }

                initAccordionListeners();
            }

            function initAccordionListeners() {
                document.querySelectorAll('.accordion-header').forEach(header => {
                    header.addEventListener('click', toggleAccordion);
                });
            }

            function toggleAccordion(event) {
                const header = event.currentTarget;

                document.querySelectorAll('.accordion-header.active').forEach(h => {
                    if (h !== header) {
                        h.classList.remove('active');
                        h.nextElementSibling.classList.remove('active');
                    }
                });

                header.classList.toggle('active');
                header.nextElementSibling.classList.toggle('active');
            }

            /* =========================
               КУРСОР
            ========================= */
            const circle = document.getElementById('circle');
            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;

            function updatePointerPosition(clientX, clientY) {
                mouseX = clientX;
                mouseY = clientY;
                if (circle) {
                    circle.style.transform = `translate(calc(${mouseX}px - 50%), calc(${mouseY}px - 50%))`;
                }
            }

            document.addEventListener('mousemove', (e) => updatePointerPosition(e.clientX, e.clientY));
            document.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    updatePointerPosition(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            /* =========================
               ФИГУРКИ (ПЕРСОНАЖИ)
            ========================= */
            const fog = document.getElementById('fog');
            if (fog) fog.classList.add('waking-up');

            const isMobile = window.matchMedia('(max-width: 768px)').matches;
            const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            const figureImageFiles = [
                'images/hero1.png', 'images/hero2.png', 'images/hero3.png',
                'images/hero4.png', 'images/hero5.png', 'images/hero6.png',
                'images/hero7.png', 'images/hero8.png'
            ];

            // На мобильных рисуем только 5 фигурок для сохранения GPU
            const activeFiles = isMobile ? figureImageFiles.slice(0, 5) : figureImageFiles;
            const figures = [];

            for (let i = 0; i < activeFiles.length; i++) {
                const imgFileName = activeFiles[i];
                const imgCode = `<img src="${imgFileName}" alt="fig" loading="lazy">`;

                let el = document.createElement('div');
                el.className = 'figure';
                el.innerHTML = imgCode;
                document.body.appendChild(el);

                let size = 25 + Math.random() * 20;
                el.style.width = size + 'px'; el.style.height = size + 'px';
                let baseOpacity = 0.5 + Math.random() * 0.5;
                el.style.opacity = baseOpacity;

                figures.push({
                    element: el,
                    x: Math.random() * window.innerWidth + window.scrollX,
                    y: Math.random() * window.innerHeight + window.scrollY,
                    offsetX: (Math.random() - 0.5) * 40,
                    offsetY: (Math.random() - 0.5) * 40,
                    speed: 0.03 + Math.random() * 0.03,
                    jumpPhase: Math.random() * Math.PI * 2,
                    state: 'follow',
                    dropX: 0,
                    dropY: 0,
                    baseOpacity: baseOpacity,
                    direction: 1
                });
            }

            function handleDropInteraction(clientX, clientY, target) {
                if (target.closest('a, button, .accordion-item, .accordion-header, .mobile-menu-toggle, nav.top-menu, .current-event-card, .next-event-section')) {
                    return;
                }
                let followers = figures.filter(f => f.state === 'follow');
                if (followers.length > 0) {
                    let randomFig = followers[Math.floor(Math.random() * followers.length)];
                    randomFig.state = 'dropped';
                    randomFig.dropX = clientX + window.scrollX;
                    randomFig.dropY = clientY + window.scrollY;
                    randomFig.element.style.opacity = 1;
                    setTimeout(() => {
                        randomFig.state = 'follow';
                        randomFig.element.style.opacity = randomFig.baseOpacity;
                    }, 4000 + Math.random() * 2000);
                }
            }

            document.addEventListener('mousedown', (e) => handleDropInteraction(e.clientX, e.clientY, e.target));

            /* =========================
               АНИМАЦИОННЫЙ ЦИКЛ
            ========================= */
            let clusterX = mouseX + window.scrollX;
            let clusterY = mouseY + window.scrollY;
            let time = 0;

            // Visibility API: останавливает анимацию при неактивной вкладке (экономия батареи)
            let rafId = null;
            let isTabVisible = true;
            document.addEventListener('visibilitychange', () => {
                isTabVisible = document.visibilityState === 'visible';
                if (isTabVisible && rafId === null) {
                    rafId = requestAnimationFrame(animate);
                }
            });

            function animate() {
                time += 0.08;

                let targetClusterX = mouseX + window.scrollX;
                let targetClusterY = mouseY + window.scrollY;

                let dx = targetClusterX - clusterX;
                let dy = targetClusterY - clusterY;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) {
                    const clusterOffset = 35;
                    clusterX += (targetClusterX - (dx / dist) * clusterOffset - clusterX) * 0.4;
                    clusterY += (targetClusterY - (dy / dist) * clusterOffset - clusterY) * 0.4;
                }

                figures.forEach(fig => {
                    let oldX = fig.x;

                    if (fig.state === 'follow') {
                        let targetFigX = clusterX + fig.offsetX;
                        let targetFigY = clusterY + fig.offsetY;
                        fig.x += (targetFigX - fig.x) * fig.speed;
                        fig.y += (targetFigY - fig.y) * fig.speed;

                        fig.element.style.position = 'fixed';
                        let viewportX = fig.x - window.scrollX;
                        let viewportY = fig.y - window.scrollY;

                        // Деликатное покачивание 4px вместо 25px
                        let bounceY = (!prefersReducedMotion) ? Math.sin(time + fig.jumpPhase) * 4 : 0;
                        fig.element.style.transform = `translate(calc(${viewportX}px - 50%), calc(${viewportY + bounceY}px - 50%)) scaleX(${fig.direction})`;

                    } else {
                        let targetFigX = fig.dropX;
                        let targetFigY = fig.dropY;
                        fig.x += (targetFigX - fig.x) * fig.speed;
                        fig.y += (targetFigY - fig.y) * fig.speed;

                        fig.element.style.position = 'absolute';
                        fig.element.style.transform = `translate(calc(${fig.x}px - 50%), calc(${fig.y}px - 50%)) scaleX(${fig.direction})`;
                    }

                    let deltaX = fig.x - oldX;
                    if (Math.abs(deltaX) > 0.3) fig.direction = deltaX > 0 ? 1 : -1;
                });

                rafId = requestAnimationFrame(animate);
            }

            rafId = requestAnimationFrame(animate);

            /* =========================
               ЗАПУСК
            ========================= */
            renderAnnouncements();
        });
    </script>
