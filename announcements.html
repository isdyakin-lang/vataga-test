<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VATAGA - Анонсы</title> 
    
    <!-- Подключение оригинальных шрифтов -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@900&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/caviar-dreams" rel="stylesheet">
    <link rel="stylesheet" href="css/fonts.css">

    <style>
        @font-face {
            font-family: 'Caviar Dreams';
            src: url('fonts/CaviarDreams.woff2') format('woff2'),
                 url('https://fonts.cdnfonts.com/s/14299/CaviarDreams.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Caviar Dreams';
            src: url('fonts/CaviarDreams_Bold.woff2') format('woff2'),
                 url('https://fonts.cdnfonts.com/s/14299/CaviarDreams_Bold.woff') format('woff');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body { 
            font-family: 'Caviar Dreams', sans-serif; 
            background-color: #f7f7f7; 
            color: #000000;            
            overflow-x: hidden; 
            padding-top: 150px;
        }

        body.no-scroll {
            overflow: hidden !important;
        }

        /* На ПК скрываем системный курсор, на смартфонах естественный */
        @media (min-width: 769px) {
            html, body, * { 
                cursor: none !important; 
                user-select: none; 
            }
        }

        @media (max-width: 768px) {
            .cursor-circle {
                display: none !important;
            }
        }

        /* Оверлей шума */
        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 900; opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Область для блюра под шапкой */
        .header-blur-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 130px;
            z-index: 608;
            pointer-events: none;
            background: linear-gradient(to bottom, 
                                rgba(247, 247, 247, 0.95) 0%,
                                rgba(247, 247, 247, 0.95) 75%,
                                rgba(247, 247, 247, 0.4) 90%,
                                rgba(247, 247, 247, 0.0) 100%);
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px); 
            mask-image: linear-gradient(to bottom, 
                                black 0%,
                                black 75%,
                                rgba(0,0,0,0.6) 90%,
                                transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, 
                                        black 0%, 
                                        black 75%, 
                                        rgba(0,0,0,0.6) 90%,
                                        transparent 100%);
        }

        /* Логотип */
        .logo {
            position: fixed; top: 40px; left: 50px;
            font-family: 'League Spartan', sans-serif;
            font-size: 32px; 
            font-weight: 900; 
            text-transform: uppercase; 
            color: #000000;
            text-decoration: none;
            z-index: 650; 
            transition: color 0.3s, transform 0.3s;
        }

        .logo:hover {
            color: #000000; 
            transform: scale(1.05);
        }

        /* Меню навигации (Десктоп) */
        nav.top-menu {
            position: fixed; top: 40px; right: 50px;
            display: flex; flex-direction: row; gap: 40px; 
            z-index: 650; 
            transition: opacity 0.3s ease;
        }

        nav.top-menu a {
            color: #000000; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 18px; 
            transition: color 0.3s, transform 0.3s;
            white-space: nowrap;
        }

        nav.top-menu a:hover {
            color: #000000; 
            transform: scale(1.05);
        }
        
        nav.top-menu a[href="announcements.html"] {
            font-weight: 900; 
        }

        /* Мобильная кнопка меню (Бургер) */
        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 700;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 10px;
            flex-direction: column;
            justify-content: space-between;
            width: 40px;
            height: 32px;
        }

        .mobile-menu-toggle span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: #000000;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .mobile-menu-toggle.active span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }
        .mobile-menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }
        .mobile-menu-toggle.active span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        /* Основной контейнер контента */
        .content-container {
            position: relative;
            z-index: 600; 
            max-width: 1200px;
            margin: 10px auto 100px auto;
            padding: 0 50px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* Контейнер для текущего и следующего анонсов */
        .upcoming-events-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            width: 100%;
            margin-bottom: 60px;
            justify-content: center;
            max-width: 1100px;
            align-items: flex-start;
        }

        /* Секция текущего мероприятия */
        .current-event-section { 
            flex-grow: 1;
            max-width: 780px; 
            min-width: 300px; 
        }
        .current-event-card {
            margin-bottom: 0; 
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            padding: 30px;
            box-sizing: border-box;
            display: flex;
            flex-direction: row;
            gap: 50px;
            align-items: flex-start;
        }
        .current-event-poster {
            flex-shrink: 0; 
            width: 280px;
            height: 373px; 
            border-radius: 8px;
            overflow: hidden;
            background-color: #e0e0e0;
        }
        .current-event-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .current-event-details {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            color: #444444;
            font-size: 1.1em;
            line-height: 1.6;
            padding-top: 5px; 
        }
        .current-event-details h2 {
            font-family: 'Caviar Dreams', sans-serif; 
            font-size: 1.8em; 
            font-weight: normal; 
            color: #000000;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .event-date-time {
            font-size: 1.2em;
            font-weight: bold;
            color: #000000;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column; 
            gap: 5px;
        }
        .event-description {
            margin-bottom: 30px;
        }
        .register-button {
            display: inline-block;
            padding: 12px 25px;
            background-color: #000000;
            color: #f7f7f7;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1em;
            transition: background-color 0.3s, transform 0.3s;
        }
        .register-button:hover {
            background-color: #333333;
            transform: translateY(-2px);
        }

        /* Секция следующего мероприятия */
        .next-event-section { 
            flex-shrink: 0; 
            width: 280px; 
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center; 
            text-align: center; 
        }
        .next-event-section h3 { 
            font-family: 'Caviar Dreams', sans-serif;
            font-size: 0.9em; 
            font-weight: 600;
            color: #000000;
            margin-top: 0;
            margin-bottom: 10px;
            width: 100%;
        }
        .next-event-poster {
            width: 100%; 
            height: 345px; 
            border-radius: 6px;
            overflow: hidden;
            background-color: #e0e0e0;
            margin-bottom: 10px;
        }
        .next-event-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .next-event-details {
            width: 100%; 
            color: #000000;
            font-size: 0.9em; 
            line-height: 1.4; 
        }
        .next-event-details h4 {
            font-family: 'Caviar Dreams', sans-serif;
            font-size: 0.95em; 
            font-weight: bold;
            color: #000000;
            margin-top: 0;
            margin-bottom: 0; 
        }

        /* Секция предыдущих мероприятий (Аккордеон) */
        .previous-events-section {
            width: 100%;
        }
        .section-title {
            font-family: 'Caviar Dreams', sans-serif; 
            font-size: 1.2em; 
            font-weight: 600; 
            color: #000000;
            text-align: left;
            width: 100%; 
            margin-bottom: 25px; 
            margin-top: 0; 
        }
        .accordion { width: 100%; max-width: 900px; }
        .accordion-item {
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            transition: box-shadow 0.3s ease;
        }
        .accordion-item:hover { box-shadow: 0 6px 20px rgba(0,0,0,0.06); }
        .accordion-header {
            width: 100%;
            padding: 18px 45px 18px 25px;
            background-color: transparent;
            border: none;
            text-align: left;
            font-family: 'Caviar Dreams', sans-serif;
            font-size: 1.1em;
            font-weight: bold;
            color: #000000;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
            position: relative; 
        }
        .accordion-header:hover { background-color: #f0f0f0; }
        .accordion-header::after {
            content: '›'; 
            font-size: 1.5em;
            transform: translateY(-50%) rotate(90deg); 
            transition: transform 0.3s ease;
            position: absolute;
            right: 20px;
            top: 50%;
        }
        .accordion-header.active::after { transform: translateY(-50%) rotate(-90deg); }
        .event-title { flex-grow: 1; margin-right: 20px; }
        .event-date {
            font-size: 0.9em; color: #888888; white-space: nowrap;
            flex-shrink: 0; margin-left: 15px;
        }
        .accordion-content {
            padding: 0 25px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, padding 0.4s ease-out; 
            color: #555555; line-height: 1.5;
        }
        .accordion-content.active { max-height: 500px; padding: 15px 25px 20px; }
        .event-content-wrapper { display: flex; gap: 25px; align-items: flex-start; }
        .event-image-small {
            flex-shrink: 0;
            width: 90px; 
            height: 120px; 
            border-radius: 6px;
            overflow: hidden;
            background-color: #e0e0e0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .event-image-small img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .event-text-wrapper { flex-grow: 1; }
        .event-summary { margin-top: 0; margin-bottom: 15px; }
        .read-more {
            display: inline-block; color: #000000; text-decoration: none;
            font-weight: bold; font-size: 0.9em; transition: color 0.3s;
        }
        .read-more:hover { color: #555555; }

        /* ТУМАН, КУРСОР, ФИГУРКИ */
        .fog-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            z-index: 500; pointer-events: none; mask-composite: intersect; 
            -webkit-mask-composite: source-in;
            transition: background 0.5s linear, backdrop-filter 0.5s linear, -webkit-backdrop-filter 0.5s linear; 
        }
        .fog-overlay.waking-up {
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        }
        .cursor-circle { 
            position: fixed; top: 0; left: 0; width: 20px; height: 20px; 
            border: 2px solid #000000; border-radius: 50%; 
            pointer-events: none; transform: translate(-50%, -50%); 
            z-index: 999999; 
        }
        .figure {
            position: fixed; top: 0; left: 0; pointer-events: none;
            z-index: 605; transition: opacity 0.5s; 
        }
        .figure img { width: 100%; height: 100%; object-fit: contain; }

        /* МОБИЛЬНАЯ АДАПТАЦИЯ */
        @media (max-width: 900px) {
            .upcoming-events-container { flex-direction: column; align-items: center; }
            .current-event-section { max-width: 100%; width: 100%; margin-bottom: 30px; }
            .current-event-card { flex-direction: column; align-items: center; gap: 25px; padding: 20px; }
            .current-event-poster { width: 220px; height: 293px; }
            .current-event-details { text-align: center; padding-top: 0; }
            .event-date-time { align-items: center; }
            .next-event-section { width: 100%; max-width: 360px; margin-bottom: 30px; padding: 15px; }
            .next-event-section h3, .next-event-details h4 { text-align: center; }
            .next-event-poster { height: auto; aspect-ratio: 3 / 4; }
        }

        @media (max-width: 768px) {
            body { padding-top: 110px; }
            
            .logo { top: 25px; left: 20px; font-size: 26px; }

            .mobile-menu-toggle {
                display: flex;
            }

            nav.top-menu {
                position: fixed;
                top: 0;
                right: 0;
                width: 100vw;
                height: 100vh;
                background-color: rgba(247, 247, 247, 0.98);
                backdrop-filter: blur(15px);
                -webkit-backdrop-filter: blur(15px);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 30px;
                opacity: 0;
                visibility: hidden;
                transition: opacity 0.3s ease, visibility 0.3s ease;
                z-index: 600;
            }

            nav.top-menu.mobile-open {
                opacity: 1;
                visibility: visible;
                pointer-events: auto !important;
            }

            nav.top-menu a { font-size: 24px; }

            .content-container { padding: 0 20px; margin-top: 10px; }
            .current-event-poster { width: 200px; height: 266px; }
            .current-event-details h2 { font-size: 1.4em; }
            .event-date-time { font-size: 1.05em; }
            .accordion-header { font-size: 0.95em; padding: 15px 35px 15px 15px; }
            .accordion-header::after { right: 15px; }
            .accordion-content.active { padding: 10px 15px 15px; }
            .event-content-wrapper { flex-direction: column; align-items: center; gap: 15px; }
            .event-image-small {
                width: 130px; 
                height: 173px; 
            }
            .event-text-wrapper { text-align: center; }
            .header-blur-background { height: 100px; }
        }

        @media (max-width: 480px) {
            .current-event-poster { width: 180px; height: 240px; }
            .current-event-details h2 { font-size: 1.25em; }
            .event-date-time { font-size: 0.95em; }
            .accordion-header { font-size: 0.9em; padding: 12px 30px 12px 12px; }
            .accordion-header::after { right: 12px; }
            .event-image-small {
                width: 110px; 
                height: 146px; 
            }
        }
    </style>
</head>
<body>

    <a href="index.html" class="logo">!vataga</a>

    <!-- Мобильная кнопка меню -->
    <button class="mobile-menu-toggle" id="menuToggle" aria-label="Открыть меню">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav class="top-menu" id="topMenu">
        <a href="projects.html">Проекты</a> 
        <a href="members.html">Участники</a> 
        <a href="archive.html">Архив</a>
        <a href="merch.html">Мерч</a>
        <a href="announcements.html" class="active">Анонсы</a>
    </nav>

    <div class="header-blur-background" id="headerBlurBackground"></div>

    <div class="content-container">
        <div class="upcoming-events-container">
            <section id="current-event-section-dynamic" class="current-event-section" style="display:none;"></section>
            <section id="next-event-section-dynamic" class="next-event-section" style="display:none;"></section>
        </div>
        
        <section class="previous-events-section">
            <p class="section-title">Предыдущие мероприятия</p>
            <div id="accordion-dynamic" class="accordion"></div>
        </section>
    </div>

    <div class="fog-overlay" id="fog"></div>
    <div class="noise-overlay"></div>
    <div class="cursor-circle" id="circle"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuToggle = document.getElementById('menuToggle');
            const topMenu = document.getElementById('topMenu');

            // Управление мобильным меню
            menuToggle.addEventListener('click', () => {
                menuToggle.classList.toggle('active');
                topMenu.classList.toggle('mobile-open');
            });

            // Массив мероприятий
            const allEventsData = [
                {
                    id: 'event-portfolio-review-20241129', title: 'Открытое портфолио ревью', date: '2024-11-29', time: '18:00',
                    description: 'Приглашаем на открытое портфолио ревью, где каждый сможет получить ценную обратную связь от опытных архитекторов и дизайнеров.',
                    summary: 'Возможность получить ценную обратную связь по вашему архитектурному или дизайнерскому портфолио от экспертов.',
                    poster_large: 'images/announcements/portfolio-review-20241129.jpg',
                    poster_small: 'images/announcements/portfolio-review-20241129.jpg',
                    link: '#'
                },
                {
                    id: 'event-intro-illumica-20241213', title: 'Знакомство с бюро Иллюмика', date: '2024-12-13', time: '17:20',
                    description: 'Приглашаем на встречу с представителями архитектурного бюро Иллюмика. Узнайте о их проектах, философии дизайна и возможностях для молодых специалистов.',
                    summary: 'Встреча с архитектурным бюро Иллюмика: проекты, философия, возможности для молодых специалистов.',
                    poster_large: 'images/announcements/intro-illumica-20241213.jpg',
                    poster_small: 'images/announcements/intro-illumica-20241213.jpg',
                    link: '#'
                },
                {
                    id: 'event-lecture-pik-20250328', title: 'Лекция от ПИК', date: '2025-03-28', time: '17:20',
                    description: 'Представляем эксклюзивную лекцию от ведущих специалистов компании ПИК. Обсудим актуальные тренды в девелопменте, инновационные подходы к проектированию жилых комплексов.',
                    summary: 'Актуальные тренды в девелопменте и инновационные подходы к проектированию от компании ПИК.',
                    poster_large: 'images/announcements/lecture-pik-20250328.jpg',
                    poster_small: 'images/announcements/lecture-pik-20250328.jpg',
                    link: '#'
                },
                {
                    id: 'event-arch-moscow-stand-20250524', title: 'Рассказ о стенде на АРХ Москва', date: '2025-05-24', time: '11:00',
                    description: 'Присоединяйтесь к нам, чтобы узнать все подробности о нашем стенде на выставке АРХ Москва. Поделимся концепцией, процессом создания и самыми интересными моментами.',
                    summary: 'Подробности о концепции и создании нашего выставочного стенда на АРХ Москва.',
                    poster_large: 'images/announcements/arch-moscow-stand-20250524.jpg',
                    poster_small: 'images/announcements/arch-moscow-stand-20250524.jpg',
                    link: '#'
                },
                {
                    id: 'event-pasta-bridges-20250908', title: 'Лекция-знакомство и воркшоп "Мосты из макарон"', date: '2025-09-08', time: '18:00',
                    description: 'На этой увлекательной лекции мы погрузимся в основы инженерной мысли, а затем на практическом воркшопе попробуем построить настоящие мосты из макарон!',
                    summary: 'Инженерная лекция и практический воркшоп по созданию и тестированию прочных мостов из макарон.',
                    poster_large: 'images/announcements/pasta-bridges-20250908.jpg',
                    poster_small: 'images/announcements/pasta-bridges-20250908.jpg',
                    link: '#'
                },
                {
                    id: 'event-gdk-nizhny-novgorod-20250919', title: 'ГДК Нижний Новгород', date: '2025-09-19', time: '17:20',
                    description: 'Приглашаем всех желающих принять участие в мероприятии "ГДК Нижний Новгород". Вас ждут интересные лекции, демонстрации и практические занятия по тематике городского развития и дизайна.',
                    summary: 'Мероприятие "ГДК Нижний Новгород": лекции, демонстрации и практические занятия по городскому развитию.',
                    poster_large: 'images/announcements/gdk-nizhny-novgorod-20250919.JPG',
                    poster_small: 'images/announcements/gdk-nizhny-novgorod-20250919.JPG',
                    link: '#'

            function parseEventDate(event) {
                return new Date(`${event.date}T${event.time}:00`);
            }

            function formatDate(dateObj) {
                const options = { day: 'numeric', month: 'long', year: 'numeric' };
                return dateObj.toLocaleDateString('ru-RU', options);
            }

            function categorizeEvents(events) {
                const now = new Date();
                const upcoming = [], past = [];
                events.forEach(event => {
                    const eventDateTime = parseEventDate(event);
                    if (eventDateTime > now) upcoming.push(event);
                    else past.push(event);
                });
                upcoming.sort((a, b) => parseEventDate(a) - parseEventDate(b));
                past.sort((a, b) => parseEventDate(b) - parseEventDate(a));
                return { currentEvent: upcoming[0] || null, nextEvent: upcoming[1] || null, previousEvents: past };
            }

            function renderCurrentEvent(event) {
                if (!event) return '';
                const eventDateTime = parseEventDate(event);
                return `
                    <div class="current-event-card">
                        <div class="current-event-poster"><img src="${event.poster_large}" alt="Постер мероприятия"></div>
                        <div class="current-event-details">
                            <h2>${event.title}</h2>
                            <p class="event-date-time">
                                <span class="date">${formatDate(eventDateTime)}</span>
                                <span class="time">${event.time} МСК</span>
                            </p>
                            <p class="event-description">${event.description}</p>
                            <a href="${event.link}" class="register-button">Зарегистрироваться</a>
                        </div>
                    </div>`;
            }

            function renderNextEvent(event) {
                if (!event) return '';
                return `
                    <div class="next-event-card">
                        <h3>Запланированное</h3>
                        <div class="next-event-poster"><img src="${event.poster_small}" alt="Постер следующего мероприятия"></div>
                        <div class="next-event-details"><h4>${event.title}</h4></div>
                    </div>`;
            }

            function renderAccordionItem(event, isOpen = false) {
                const eventDateTime = parseEventDate(event);
                return `
                    <div class="accordion-item" id="event-${event.id}">
                        <button class="accordion-header ${isOpen ? 'active' : ''}">
                            <span class="event-title">${event.title}</span>
                            <span class="event-date">${formatDate(eventDateTime)}</span>
                        </button>
                        <div class="accordion-content ${isOpen ? 'active' : ''}">
                            <div class="event-content-wrapper">
                                <div class="event-image-small"><img src="${event.poster_small}" alt="Постер мероприятия"></div>
                                <div class="event-text-wrapper">
                                    <p class="event-summary">${event.summary}</p>
                                    <a href="${event.link}" class="read-more">Подробнее</a>
                                </div>
                            </div>
                        </div>
                    </div>`;
            }

            function renderAnnouncements() {
                const { currentEvent, nextEvent, previousEvents } = categorizeEvents(allEventsData);
                const currentSection = document.getElementById('current-event-section-dynamic');
                const nextSection = document.getElementById('next-event-section-dynamic');
                const accordion = document.getElementById('accordion-dynamic');
                const prevTitle = document.querySelector('.previous-events-section .section-title');
                currentSection.innerHTML = ''; currentSection.style.display = 'none';
                nextSection.innerHTML = ''; nextSection.style.display = 'none';
                accordion.innerHTML = ''; prevTitle.style.display = 'none';
                if (currentEvent) { currentSection.innerHTML = renderCurrentEvent(currentEvent); currentSection.style.display = 'flex'; }
                if (nextEvent) { nextSection.innerHTML = renderNextEvent(nextEvent); nextSection.style.display = 'flex'; }
                if (previousEvents.length > 0) {
                    prevTitle.style.display = 'block';
                    previousEvents.forEach((event, i) => { accordion.innerHTML += renderAccordionItem(event, i === 0); });
                } 
                initAccordionListeners();
            }

            function initAccordionListeners() {
                document.querySelectorAll('.accordion-header').forEach(header => {
                    header.removeEventListener('click', toggleAccordion);
                    header.addEventListener('click', toggleAccordion);
                });
            }

            function toggleAccordion(event) {
                const header = event.currentTarget;
                document.querySelectorAll('.accordion-header.active').forEach(h => {
                    if (h !== header) { h.classList.remove('active'); h.nextElementSibling.classList.remove('active'); }
                });
                header.classList.toggle('active');
                header.nextElementSibling.classList.toggle('active');
            }

            // --- Анимация тумана и курсора ---
            const circle = document.getElementById('circle');
            const fog = document.getElementById('fog');
            let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
            let clusterX = mouseX, clusterY = mouseY;
            let time = 0; 
            let currentHoleRadius = 250; 
            if (fog) fog.classList.add('waking-up'); 

            function updatePointerPosition(clientX, clientY) {
                mouseX = clientX; 
                mouseY = clientY;
                if (circle) circle.style.transform = `translate(${mouseX}px, ${mouseY}px) translate(-50%, -50%)`;
            }

            document.addEventListener('mousemove', (e) => updatePointerPosition(e.clientX, e.clientY));
            document.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    updatePointerPosition(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });
            
            const figureImageFiles = ['images/hero1.png', 'images/hero2.png', 'images/hero3.png', 'images/hero4.png', 'images/hero5.png', 'images/hero6.png', 'images/hero7.png', 'images/hero8.png'];
            const figuresCount = 8; 
            const figures = []; 
            
            for (let i = 0; i < figuresCount; i++) {
                const imgFileName = figureImageFiles[i % figureImageFiles.length];
                const imgCode = `<img src="${imgFileName}" alt="fig">`;
                let el = document.createElement('div');
                el.className = 'figure'; el.innerHTML = imgCode; document.body.appendChild(el); 
                let size = 25 + Math.random() * 20; 
                el.style.width = size + 'px'; el.style.height = size + 'px';
                let baseOpacity = 0.5 + Math.random() * 0.5; 
                el.style.opacity = baseOpacity;
                figures.push({
                    element: el, x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight,
                    offsetX: (Math.random() - 0.5) * 40, offsetY: (Math.random() - 0.5) * 40,
                    speed: 0.03 + Math.random() * 0.03, jumpPhase: Math.random() * Math.PI * 2,
                    state: 'follow', dropX: 0, dropY: 0, baseOpacity: baseOpacity, direction: 1
                });
            }

            document.addEventListener('mousedown', (e) => {
                if (e.target.closest('a, button')) return;
                const followers = figures.filter(f => f.state === 'follow');
                if (followers.length > 0) {
                    const randomFig = followers[Math.floor(Math.random() * followers.length)];
                    randomFig.state = 'dropped'; randomFig.dropX = e.clientX; randomFig.dropY = e.clientY;
                    randomFig.element.style.opacity = 1; 
                    setTimeout(() => { randomFig.state = 'follow'; randomFig.element.style.opacity = randomFig.baseOpacity; }, 4000 + Math.random() * 2000); 
                }
            });

            function animate() {
                time += 0.08; 
                currentHoleRadius += (250 - currentHoleRadius) * 0.05;
                const dx = mouseX - clusterX, dy = mouseY - clusterY, dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0) {
                    clusterX += (mouseX - (dx / dist) * 35 - clusterX) * 0.4;
                    clusterY += (mouseY - (dy / dist) * 35 - clusterY) * 0.4;
                }
                const maskLayers = [`radial-gradient(circle ${currentHoleRadius}px at ${mouseX}px ${mouseY}px, transparent 15%, rgba(0,0,0,0.6) 45%, black 100%)`];
                
                figures.forEach(fig => {
                    const oldX = fig.x; 
                    if (fig.state === 'follow') {
                        fig.x += (clusterX + fig.offsetX - fig.x) * fig.speed;
                        fig.y += (clusterY + fig.offsetY - fig.y) * fig.speed;
                        fig.element.style.transform = `translate(${fig.x}px, ${fig.y + Math.sin(time + fig.jumpPhase) * 5}px) translate(-50%, -50%) scaleX(${fig.direction})`;
                    } else {
                        fig.x += (fig.dropX - fig.x) * fig.speed; 
                        fig.y += (fig.dropY - fig.y) * fig.speed;
                        fig.element.style.transform = `translate(${fig.x}px, ${fig.y}px) translate(-50%, -50%) scaleX(${fig.direction})`;
                        maskLayers.push(`radial-gradient(circle 350px at ${fig.x}px ${fig.y}px, transparent 50%, rgba(0,0,0,0.3) 75%, black 100%)`);
                    }
                    if (Math.abs(fig.x - oldX) > 0.1) fig.direction = (fig.x - oldX) > 0 ? 1 : -1;
                });
                
                if (fog) fog.style.maskImage = maskLayers.join(', ');
                requestAnimationFrame(animate);
            }
            
            animate(); 
            renderAnnouncements();
        }); 
    </script>
