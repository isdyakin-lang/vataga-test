<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VATAGA - Главная</title>
    
    <!-- Шрифты: League Spartan для лого и Caviar Dreams для текста -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@900&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/caviar-dreams" rel="stylesheet">
    <link rel="stylesheet" href="css/fonts.css">

    <style>
        @font-face {
            font-family: 'Caviar Dreams';
            src: url('fonts/CaviarDreams.woff2') format('woff2'),
                 url('https://fonts.cdnfonts.com/s/14299/CaviarDreams.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Caviar Dreams';
            src: url('fonts/CaviarDreams_Bold.woff2') format('woff2'),
                 url('https://fonts.cdnfonts.com/s/14299/CaviarDreams_Bold.woff') format('woff');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        @media (min-width: 769px) {
            html, body, * { 
                cursor: none !important; 
                user-select: none; 
            }
        }

        @media (max-width: 768px) {
            .cursor-circle {
                display: none !important;
            }
        }
        
        body { 
            font-family: 'Caviar Dreams', 'Montserrat', sans-serif; 
            margin: 0; 
            padding: 0;
            background-color: #f7f7f7; 
            color: #000000;            
            overflow: hidden;          
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 900; opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Блюр заднего фона при открытии микро-меню */
        .page-blur-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 680;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background: rgba(247, 247, 247, 0.3);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        body.menu-open .page-blur-overlay {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* Меню навигации (Десктоп) */
        nav.top-menu {
            position: fixed; top: 40px; right: 50px;
            display: flex; flex-direction: row; gap: 40px; 
            z-index: 700; 
            pointer-events: none;
            transition: pointer-events 0s linear 3s, opacity 0.3s ease; 
        }

        nav.top-menu a {
            color: #000000; 
            text-decoration: none; 
            font-family: 'Caviar Dreams', 'Montserrat', sans-serif;
            font-weight: bold; 
            font-size: 18px; 
            transition: color 0.3s, transform 0.3s, opacity 0.3s;
            white-space: nowrap;
            opacity: 0.8;
        }

        nav.top-menu a:hover {
            color: #000000; 
            opacity: 1;
            transform: scale(1.05);
        }

        /* Мобильная кнопка меню (Бургер) */
        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 750;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 10px;
            flex-direction: column;
            justify-content: space-between;
            width: 40px;
            height: 32px;
            pointer-events: none;
            transition: pointer-events 0s linear 3s;
            -webkit-tap-highlight-color: transparent;
        }

        .mobile-menu-toggle span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: #000000;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .mobile-menu-toggle.active span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }
        .mobile-menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }
        .mobile-menu-toggle.active span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        .center-title {
            font-family: 'League Spartan', sans-serif;
            font-size: clamp(3.5rem, 12vw, 11rem); 
            font-weight: 900; 
            text-transform: uppercase; 
            letter-spacing: -3px; 
            line-height: 1; 
            z-index: 100; 
            color: #000000;
            text-decoration: none;
            pointer-events: none; 
            transition: color 0.3s, transform 0.3s, pointer-events 0s linear 3s; 
            text-align: center;
        }

        .center-title:hover {
            color: #000000; 
            transform: scale(1.02);
        }

        .fog-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(30px); 
            -webkit-backdrop-filter: blur(30px);
            z-index: 500; 
            pointer-events: none; 
            mask-composite: intersect; 
            -webkit-mask-composite: source-in;
            transition: background 3s linear, backdrop-filter 3s linear, -webkit-backdrop-filter 3s linear;
        }

        .fog-overlay.waking-up {
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(6px); 
            -webkit-backdrop-filter: blur(6px);
        }

        .cursor-circle { 
            position: fixed; top: 0; left: 0; width: 20px; height: 20px; 
            border: 2px solid #000000; border-radius: 50%; 
            pointer-events: none; transform: translate(-50%, -50%); 
            z-index: 999999; 
        }
        
        .figure {
            position: fixed; top: 0; left: 0; pointer-events: none;
            z-index: 605; 
            transition: opacity 0.5s; 
        }
        
        .figure img { width: 100%; height: 100%; object-fit: contain; }

        /* МОБИЛЬНАЯ АДАПТАЦИЯ */
        @media (max-width: 768px) {
            .mobile-menu-toggle {
                display: flex;
            }

            /* Компактное МИКРО-МЕНЮ справа вверху */
            nav.top-menu {
                position: fixed;
                top: 70px;
                right: 25px;
                width: auto;
                min-width: 180px;
                height: auto;
                background-color: rgba(255, 255, 255, 0.95);
                border: 1px solid rgba(0, 0, 0, 0.08);
                border-radius: 12px;
                padding: 18px 22px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
                flex-direction: column;
                justify-content: flex-start;
                align-items: flex-end;
                gap: 14px;
                opacity: 0;
                visibility: hidden;
                transform: translateY(-10px);
                transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
                z-index: 700;
            }

            nav.top-menu.mobile-open {
                opacity: 1;
                visibility: visible;
                transform: translateY(0);
                pointer-events: auto !important;
            }

            nav.top-menu a {
                font-size: 19px;
                font-weight: bold;
                text-align: right;
                display: block;
                padding: 2px 0;
                pointer-events: auto !important;
            }
        }
    </style>
</head>
<body>

    <button class="mobile-menu-toggle" id="menuToggle" aria-label="Открыть меню">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="page-blur-overlay" id="blurOverlay"></div>

    <nav class="top-menu" id="topMenu">
        <a href="projects.html">Проекты</a>
        <a href="members.html">Участники</a>
        <a href="archive.html">Архив</a>
        <a href="merch.html">Мерч</a>
        <a href="announcements.html">Анонсы</a>
    </nav>

    <a href="manifesto.html" class="center-title" id="vatagaButton">
        !vataga
    </a>

    <div class="fog-overlay" id="fog"></div>
    <div class="noise-overlay"></div>
    <div class="cursor-circle" id="circle"></div>

    <script>
        const circle = document.getElementById('circle');
        const fog = document.getElementById('fog');
        const vatagaButton = document.getElementById('vatagaButton');
        const topMenu = document.getElementById('topMenu');
        const menuToggle = document.getElementById('menuToggle');
        const blurOverlay = document.getElementById('blurOverlay');
        const body = document.body;
        
        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        let clusterX = mouseX, clusterY = mouseY;
        let time = 0; 
        
        let isWakingUp = false;
        let currentHoleRadius = 0; 
        let targetHoleRadius = 0;

        function toggleMenu() {
            menuToggle.classList.toggle('active');
            topMenu.classList.toggle('mobile-open');
            body.classList.toggle('menu-open');
        }

        menuToggle.addEventListener('click', toggleMenu);
        blurOverlay.addEventListener('click', toggleMenu);

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                fog.classList.add('waking-up'); 
            }, 50); 
            
            setTimeout(() => {
                isWakingUp = true;
                targetHoleRadius = Math.min(window.innerWidth * 0.4, 250);
                vatagaButton.style.pointerEvents = 'auto';
                topMenu.style.pointerEvents = 'auto';
                menuToggle.style.pointerEvents = 'auto';
            }, 3000);
        });

        function updatePosition(clientX, clientY) {
            mouseX = clientX; 
            mouseY = clientY;
            if (circle) {
                circle.style.transform = `translate(calc(${mouseX}px - 50%), calc(${mouseY}px - 50%))`;
            }
        }

        document.addEventListener('mousemove', (e) => updatePosition(e.clientX, e.clientY));
        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                updatePosition(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        const figureImageFiles = [
            'images/hero1.png', 'images/hero2.png', 'images/hero3.png',
            'images/hero4.png', 'images/hero5.png', 'images/hero6.png',
            'images/hero7.png', 'images/hero8.png', 'images/hero13.png'
        ];
        
        const figuresCount = figureImageFiles.length; 
        const figures = []; 

        for (let i = 0; i < figuresCount; i++) {
            const imgFileName = figureImageFiles[i];
            const imgCode = `<img src="${imgFileName}" alt="fig">`;

            let el = document.createElement('div');
            el.className = 'figure';
            el.innerHTML = imgCode; 
            document.body.appendChild(el); 

            let size = 25 + Math.random() * 20; 
            el.style.width = size + 'px'; el.style.height = size + 'px';
            let baseOpacity = 0.5 + Math.random() * 0.5; 
            el.style.opacity = baseOpacity;

            figures.push({
                element: el,
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                offsetX: (Math.random() - 0.5) * 80, 
                offsetY: (Math.random() - 0.5) * 40,
                speed: 0.04 + Math.random() * 0.03, 
                jumpPhase: Math.random() * Math.PI * 2,
                state: 'follow', 
                dropX: 0, dropY: 0,
                baseOpacity: baseOpacity,
                direction: 1 
            });
        }

        const handleInteraction = (clientX, clientY, target) => {
            if(!isWakingUp || (target && (target.closest('a') || target.closest('.mobile-menu-toggle') || target.closest('nav.top-menu')))) return; 

            let followers = figures.filter(f => f.state === 'follow');
            if (followers.length > 0) {
                let randomFig = followers[Math.floor(Math.random() * followers.length)];
                randomFig.state = 'dropped';
                randomFig.dropX = clientX; randomFig.dropY = clientY;
                randomFig.element.style.opacity = 1; 
                setTimeout(() => {
                    randomFig.state = 'follow'; 
                    randomFig.element.style.opacity = randomFig.baseOpacity; 
                }, 4000 + Math.random() * 2000);
            }
        };

        document.addEventListener('mousedown', (e) => handleInteraction(e.clientX, e.clientY, e.target));

        function animate() {
            time += 0.05; 
            
            currentHoleRadius += (targetHoleRadius - currentHoleRadius) * 0.03;

            let dx = mouseX - clusterX;
            let dy = mouseY - clusterY;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 0) {
                const clusterOffset = isWakingUp ? 35 : 1000;
                clusterX += (mouseX - (dx / dist) * clusterOffset - clusterX) * 0.4;
                clusterY += (mouseY - (dy / dist) * clusterOffset - clusterY) * 0.4;
            }

            let maskLayers = [];
            
            if (currentHoleRadius > 1) {
                maskLayers.push(`radial-gradient(circle ${currentHoleRadius}px at ${mouseX}px ${mouseY}px, transparent 0%, transparent 15%, rgba(0,0,0,0.6) 45%, black 100%)`);
            } else {
                maskLayers.push(`linear-gradient(black, black)`); 
            }

            figures.forEach(fig => {
                let targetX = fig.x, targetY = fig.y;
                
                if (isWakingUp) {
                    if (fig.state === 'follow') {
                        targetX = clusterX + fig.offsetX;
                        targetY = clusterY + fig.offsetY;
                    } else {
                        targetX = fig.dropX;
                        targetY = fig.dropY;
                        maskLayers.push(`radial-gradient(circle 180px at ${fig.dropX}px ${fig.dropY}px, transparent 0%, transparent 15%, rgba(0,0,0,0.6) 45%, black 100%)`);
                    }
                }

                let oldX = fig.x;
                fig.x += (targetX - fig.x) * fig.speed;
                fig.y += (targetY - fig.y) * fig.speed;

                let deltaX = fig.x - oldX;
                if (Math.abs(deltaX) > 0.3) fig.direction = deltaX > 0 ? 1 : -1;

                // Плавное покачивание (4px вместо 25px)
                let bounceY = (isWakingUp && fig.state === 'follow') ? Math.sin(time + fig.jumpPhase) * 4 : 0;

                fig.element.style.transform = `translate(calc(${fig.x}px - 50%), calc(${fig.y + bounceY}px - 50%)) scaleX(${fig.direction})`;
            });

            let maskString = maskLayers.join(', ');
            fog.style.webkitMaskImage = maskString;
            fog.style.maskImage = maskString;

            requestAnimationFrame(animate);
        }
        
        animate(); 
    </script>
</body>
</html>
