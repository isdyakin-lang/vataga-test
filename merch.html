<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VATAGA - Мерч</title> 
    
    <!-- Подключение оригинальных шрифтов -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@900&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/caviar-dreams" rel="stylesheet">
    <link rel="stylesheet" href="css/fonts.css">

    <style>
        @font-face {
            font-family: 'Caviar Dreams';
            src: url('fonts/CaviarDreams.woff2') format('woff2'),
                 url('https://fonts.cdnfonts.com/s/14299/CaviarDreams.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Caviar Dreams';
            src: url('fonts/CaviarDreams_Bold.woff2') format('woff2'),
                 url('https://fonts.cdnfonts.com/s/14299/CaviarDreams_Bold.woff') format('woff');
            font-weight: bold;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body { 
            font-family: 'Caviar Dreams', sans-serif; 
            background-color: #f7f7f7; 
            color: #000000;            
            overflow-x: hidden; 
            padding-top: 150px;
        }

        body.no-scroll {
            overflow: hidden !important;
        }

        /* На ПК скрываем курсор, на мобильных оставляем стандартный */
        @media (min-width: 769px) {
            html, body, * { 
                cursor: none !important; 
                user-select: none; 
            }
        }

        @media (max-width: 768px) {
            .cursor-circle {
                display: none !important;
            }
        }

        /* Оверлей шума */
        .noise-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 900; opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Блюр под шапкой */
        .header-blur-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 130px;
            z-index: 608;
            pointer-events: none;
            background: linear-gradient(to bottom, 
                                rgba(247, 247, 247, 0.95) 0%,   
                                rgba(247, 247, 247, 0.95) 60%,  
                                rgba(247, 247, 247, 0.4) 80%,   
                                rgba(247, 247, 247, 0.0) 100%);
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px); 
            mask-image: linear-gradient(to bottom, 
                                black 0%,              
                                black 60%,             
                                rgba(0,0,0,0.6) 90%,   
                                transparent 100%);     
            -webkit-mask-image: linear-gradient(to bottom, 
                                        black 0%, 
                                        black 60%, 
                                        rgba(0,0,0,0.6) 90%,
                                        transparent 100%);
        }

        /* Логотип */
        .logo {
            position: fixed; top: 40px; left: 50px;
            font-family: 'League Spartan', sans-serif;
            font-size: 32px; 
            font-weight: 900; 
            text-transform: uppercase; 
            color: #000000;
            text-decoration: none;
            z-index: 650; 
            transition: color 0.3s, transform 0.3s;
        }

        .logo:hover {
            color: #000000; 
            transform: scale(1.05);
        }

        /* Меню навигации (Десктоп) */
        nav.top-menu {
            position: fixed; top: 40px; right: 50px;
            display: flex; flex-direction: row; gap: 40px; 
            z-index: 650; 
            transition: opacity 0.3s ease;
        }

        nav.top-menu a {
            color: #000000; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 18px; 
            transition: color 0.3s, transform 0.3s;
            white-space: nowrap;
        }

        nav.top-menu a:hover {
            color: #000000; 
            transform: scale(1.05);
        }
        
        nav.top-menu a.active { 
            font-weight: 900; 
        }

        /* Мобильная кнопка меню (Бургер) */
        .mobile-menu-toggle {
            display: none;
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 700;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 10px;
            flex-direction: column;
            justify-content: space-between;
            width: 40px;
            height: 32px;
        }

        .mobile-menu-toggle span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: #000000;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .mobile-menu-toggle.active span:nth-child(1) {
            transform: translateY(9px) rotate(45deg);
        }
        .mobile-menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }
        .mobile-menu-toggle.active span:nth-child(3) {
            transform: translateY(-9px) rotate(-45deg);
        }

        /* Контейнер контента */
        .content-container {
            position: relative;
            z-index: 600; 
            margin: 0 auto 100px auto; 
            max-width: 1200px;
            padding: 0 20px; 
            display: flex;
            flex-direction: column;
            align-items: center; 
        }
        
        .main-merch-image-wrapper {
            width: 100%;
            position: relative; 
            padding-bottom: 42.85%;
            background-color: #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            margin-top: 0; 
            margin-bottom: 50px; 
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
            cursor: pointer;
        }

        .main-merch-image-wrapper img {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block;
        }

        .main-merch-image-wrapper:hover {
            transform: scale(1.01); 
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
        }

        .merch-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px 20px; 
            width: 100%;
            margin-bottom: 50px;
        }

        .merch-item-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            position: relative;
            width: 100%;
        }

        .merch-item {
            position: relative; 
            width: 100%;
            height: 0; 
            padding-bottom: 133.33%;
            background-color: #e0e0e0; 
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease; 
            cursor: pointer; 
        }

        .merch-item img {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%;
            height: 100%; 
            object-fit: cover; 
            display: block;
            transition: opacity 0.4s ease;
        }

        .merch-item img:nth-child(1) {
            opacity: 1;
            z-index: 1; 
        }
        .merch-item img:nth-child(2) {
            opacity: 0;
            z-index: 0; 
        }
        
        .merch-item.is-swapped img:nth-child(1) {
            opacity: 0;
        }
        .merch-item.is-swapped img:nth-child(2) {
            opacity: 1;
        }

        .merch-item:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .merch-caption {
            width: 100%;
            text-align: left;
            padding: 2px 2px 0 2px;
            color: #000;
            font-size: 0.95em;
            line-height: 1.4;
            cursor: pointer;
        }
        .merch-caption .merch-name {
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
        }
        .merch-caption .merch-description {
            color: #555;
            font-size: 0.85em;
            display: block;
        }

        /* Туман, курсор, фигурки */
        .fog-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(6px); 
            -webkit-backdrop-filter: blur(6px);
            z-index: 500; 
            pointer-events: none; 
            mask-composite: intersect; 
            -webkit-mask-composite: source-in;
            transition: background 0.5s linear, backdrop-filter 0.5s linear, -webkit-backdrop-filter 0.5s linear; 
        }

        .fog-overlay.waking-up {
            background: rgba(255, 255, 255, 0.2); 
            backdrop-filter: blur(6px); 
            -webkit-backdrop-filter: blur(6px);
        }

        .cursor-circle { 
            position: fixed; top: 0; left: 0; width: 20px; height: 20px; 
            border: 2px solid #000000; border-radius: 50%; 
            pointer-events: none; transform: translate(-50%, -50%); 
            z-index: 999999; 
        }
        
        .figure {
            position: fixed; top: 0; left: 0; pointer-events: none;
            z-index: 605; transition: opacity 0.5s; 
        }
        
        .figure img { width: 100%; height: 100%; object-fit: contain; }

        /* Оверлей просмотра изображений (Lightbox) */
        .lightbox-overlay {
            position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(255, 255, 255, 0.92); 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000; 
            visibility: hidden; 
            opacity: 0;
            transition: opacity 0.3s, visibility 0.3s;
        }

        .lightbox-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .lightbox-image {
            max-width: 90vw; 
            max-height: 85vh; 
            object-fit: contain; 
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .lightbox-close {
            position: fixed; top: 30px; right: 35px;
            background: none; border: none; color: #000000; 
            font-size: 3em; cursor: pointer; z-index: 10001; 
            line-height: 1; padding: 0;
            transition: transform 0.2s ease-in-out, color 0.2s ease-in-out;
            -webkit-tap-highlight-color: transparent;
        }
        .lightbox-close:hover {
            transform: rotate(90deg);
            color: #555555; 
        }

        .lightbox-nav {
            position: fixed; top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.1); 
            color: #000000; 
            border: none;
            padding: 12px 18px;
            font-size: 2em;
            cursor: pointer;
            z-index: 10001;
            border-radius: 50%;
            transition: background-color 0.2s, color 0.2s;
            line-height: 1;
            -webkit-tap-highlight-color: transparent;
        }
        .lightbox-nav:hover {
            background: rgba(0, 0, 0, 0.25); 
            color: #000000;
        }
        .lightbox-nav.prev { left: 25px; }
        .lightbox-nav.next { right: 25px; }
        .lightbox-nav:disabled {
            opacity: 0.3;
            cursor: default;
            background: rgba(0, 0, 0, 0.05);
        }

        /* --- МОБИЛЬНАЯ АДАПТАЦИЯ --- */
        @media (max-width: 1024px) {
            .merch-grid { grid-template-columns: repeat(2, 1fr); gap: 30px 20px; }
        }

        @media (max-width: 768px) {
            body { padding-top: 110px; }
            .header-blur-background { height: 100px; }
            
            .logo { top: 25px; left: 20px; font-size: 26px; }

            .mobile-menu-toggle {
                display: flex;
            }

            nav.top-menu {
                position: fixed;
                top: 0;
                right: 0;
                width: 100vw;
                height: 100vh;
                background-color: rgba(247, 247, 247, 0.98);
                backdrop-filter: blur(15px);
                -webkit-backdrop-filter: blur(15px);
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 30px;
                opacity: 0;
                visibility: hidden;
                transition: opacity 0.3s ease, visibility 0.3s ease;
                z-index: 600;
            }

            nav.top-menu.mobile-open {
                opacity: 1;
                visibility: visible;
                pointer-events: auto !important;
            }

            nav.top-menu a { font-size: 24px; }

            .content-container { padding: 0 20px; margin-bottom: 60px; }
            .main-merch-image-wrapper { padding-bottom: 56.25%; margin-bottom: 30px; }
            .merch-grid { grid-template-columns: repeat(2, 1fr); gap: 20px 15px; }
            
            .lightbox-close { top: 15px; right: 15px; font-size: 2.2em; }
            .lightbox-nav { width: 42px; height: 42px; font-size: 1.5em; display: flex; align-items: center; justify-content: center; padding: 0; }
            .lightbox-nav.prev { left: 10px; }
            .lightbox-nav.next { right: 10px; }
        }

        @media (max-width: 480px) {
            body { padding-top: 90px; }
            .header-blur-background { height: 90px; }
            .main-merch-image-wrapper { padding-bottom: 65%; margin-bottom: 25px; }
            .merch-grid { grid-template-columns: 1fr; gap: 25px; }
            
            .lightbox-nav.prev, .lightbox-nav.next { 
                top: auto; bottom: 20px; transform: translateY(0); 
            } 
            .lightbox-nav.prev { left: 20px; } 
            .lightbox-nav.next { right: 20px; }
        }
    </style>
</head>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const circle = document.getElementById('circle');
        const fog = document.getElementById('fog');
        const body = document.body; 
        const menuToggle = document.getElementById('menuToggle');
        const topMenu = document.getElementById('topMenu');

        let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
        let clusterX = window.innerWidth / 2 + window.scrollX, clusterY = window.innerHeight / 2 + window.scrollY;
        let time = 0; 
        
        let isWakingUp = true; 
        let currentHoleRadius = 250; 
        let targetHoleRadius = 250;

        // Мобильное меню
        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            topMenu.classList.toggle('mobile-open');
        });

        if (fog) fog.classList.add('waking-up'); 

        function updatePointerPosition(clientX, clientY) {
            mouseX = clientX; 
            mouseY = clientY;
            if (circle) circle.style.transform = `translate(calc(${mouseX}px - 50%), calc(${mouseY}px - 50%))`;
        }

        document.addEventListener('mousemove', (e) => updatePointerPosition(e.clientX, e.clientY));
        document.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                updatePointerPosition(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        const figureImageFiles = [
            'images/hero1.png', 'images/hero2.png', 'images/hero3.png',
            'images/hero4.png', 'images/hero5.png', 'images/hero6.png',
            'images/hero7.png', 'images/hero8.png'
        ];
        const figuresCount = figureImageFiles.length; 
        const figures = []; 

        for (let i = 0; i < figuresCount; i++) {
            const imgFileName = figureImageFiles[i];
            const imgCode = `<img src="${imgFileName}" alt="fig">`;
            let el = document.createElement('div');
            el.className = 'figure';
            el.innerHTML = imgCode; 
            document.body.appendChild(el); 
            let size = 25 + Math.random() * 20; 
            el.style.width = size + 'px'; el.style.height = size + 'px';
            let baseOpacity = 0.5 + Math.random() * 0.5; 
            el.style.opacity = baseOpacity;
            figures.push({ element: el, x: Math.random() * window.innerWidth + window.scrollX, y: Math.random() * window.innerHeight + window.scrollY, offsetX: (Math.random() - 0.5) * 40, offsetY: (Math.random() - 0.5) * 40, speed: 0.03 + Math.random() * 0.03, jumpPhase: Math.random() * Math.PI * 2, state: 'follow', dropX: 0, dropY: 0, baseOpacity: baseOpacity, direction: 1, claimedItemTitle: null });
        }

        function handleDropInteraction(clientX, clientY, target) {
            if (target.closest('a, button, .merch-item-wrapper, .main-merch-image-wrapper, .mobile-menu-toggle')) {
                return;
            }
            let followers = figures.filter(f => f.state === 'follow');
            if (followers.length > 0) {
                let randomFig = followers[Math.floor(Math.random() * followers.length)];
                randomFig.state = 'dropped';
                randomFig.dropX = clientX + window.scrollX; 
                randomFig.dropY = clientY + window.scrollY;
                randomFig.element.style.opacity = 1; 
                setTimeout(() => {
                    randomFig.state = 'follow'; 
                    randomFig.element.style.opacity = randomFig.baseOpacity; 
                }, 4000 + Math.random() * 2000); 
            }
        }

        document.addEventListener('mousedown', (e) => handleDropInteraction(e.clientX, e.clientY, e.target));

        function animate() {
            time += 0.08; 
            currentHoleRadius += (targetHoleRadius - currentHoleRadius) * 0.05;
            let targetClusterX_doc = mouseX + window.scrollX;
            let targetClusterY_doc = mouseY + window.scrollY;
            let dx = targetClusterX_doc - clusterX;
            let dy = targetClusterY_doc - clusterY;
            let dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 0) {
                const clusterOffset = 35; 
                clusterX += (targetClusterX_doc - (dx / dist) * clusterOffset - clusterX) * 0.4;
                clusterY += (targetClusterY_doc - (dy / dist) * clusterOffset - clusterY) * 0.4;
            }
            let maskLayers = [];
            if (currentHoleRadius > 1) {
                maskLayers.push(`radial-gradient(circle ${currentHoleRadius}px at ${mouseX}px ${mouseY}px, transparent 0%, transparent 15%, rgba(0,0,0,0.6) 45%, black 100%)`);
            } else {
                maskLayers.push(`linear-gradient(black, black)`); 
            }
            figures.forEach(fig => {
                let oldX = fig.x; 
                if (fig.state === 'follow') {
                    let targetFigX_doc = clusterX + fig.offsetX;
                    let targetFigY_doc = clusterY + fig.offsetY;
                    fig.x += (targetFigX_doc - fig.x) * fig.speed;
                    fig.y += (targetFigY_doc - fig.y) * fig.speed;
                    fig.element.style.position = 'fixed';
                    let viewportX = fig.x - window.scrollX;
                    let viewportY = fig.y - window.scrollY;
                    let bounceY = Math.sin(time + fig.jumpPhase) * 5; 
                    fig.element.style.transform = `translate(calc(${viewportX}px - 50%), calc(${viewportY + bounceY}px - 50%)) scaleX(${fig.direction})`;
                } else {
                    let targetFigX_doc = fig.dropX; 
                    let targetFigY_doc = fig.dropY;
                    fig.x += (targetFigX_doc - fig.x) * fig.speed; 
                    fig.y += (targetFigY_doc - fig.y) * fig.speed;
                    fig.element.style.position = 'absolute';
                    fig.element.style.transform = `translate(calc(${fig.x}px - 50%), calc(${fig.y}px - 50%)) scaleX(${fig.direction})`; 
                }
                let deltaX = fig.x - oldX;
                if (Math.abs(deltaX) > 0.3) fig.direction = deltaX > 0 ? 1 : -1;
            });
            if (fog) {
                let maskString = maskLayers.join(', ');
                fog.style.webkitMaskImage = maskString;
                fog.style.maskImage = maskString;
            }
            requestAnimationFrame(animate);
        }
        animate(); 

        const merchItemWrappers = document.querySelectorAll('.merch-item-wrapper'); 
        const mainMerchImageWrapper = document.querySelector('.main-merch-image-wrapper'); 
        const lightboxOverlay = document.getElementById('lightboxOverlay');
        const lightboxImage = document.getElementById('lightboxImage');
        const lightboxPrev = document.getElementById('lightboxPrev');
        const lightboxNext = document.getElementById('lightboxNext');
        const lightboxClose = document.getElementById('lightboxClose');

        let allLightboxImages = []; 
        let currentImageIndex = 0;

        function collectLightboxImages() {
            allLightboxImages = [];
            if (mainMerchImageWrapper && mainMerchImageWrapper.querySelector('img')) {
                const img = mainMerchImageWrapper.querySelector('img');
                allLightboxImages.push({ src: img.dataset.fullSrc || img.src, alt: img.alt });
            }
            merchItemWrappers.forEach(itemWrapper => {
                const img = itemWrapper.querySelector('.merch-item img:nth-child(1)'); 
                if (img) {
                    allLightboxImages.push({ src: img.dataset.fullSrc || img.src, alt: img.alt });
                }
            });
        }
        collectLightboxImages(); 

        function showLightboxImage(index) {
            if (allLightboxImages.length === 0) return;
            currentImageIndex = (index + allLightboxImages.length) % allLightboxImages.length;
            lightboxImage.src = allLightboxImages[currentImageIndex].src;
            lightboxImage.alt = allLightboxImages[currentImageIndex].alt;
            lightboxPrev.disabled = allLightboxImages.length <= 1;
            lightboxNext.disabled = allLightboxImages.length <= 1;
        }

        function openLightbox(index) {
            lightboxOverlay.classList.add('active');
            body.classList.add('no-scroll'); 
            showLightboxImage(index);
        }

        function closeLightbox() {
            lightboxOverlay.classList.remove('active');
            body.classList.remove('no-scroll'); 
            lightboxImage.src = ''; 
        }

        if (mainMerchImageWrapper) {
            mainMerchImageWrapper.addEventListener('click', () => openLightbox(0));
        }

        lightboxPrev.addEventListener('click', () => showLightboxImage(currentImageIndex - 1));
        lightboxNext.addEventListener('click', () => showLightboxImage(currentImageIndex + 1));
        lightboxClose.addEventListener('click', closeLightbox);
        lightboxOverlay.addEventListener('click', (e) => {
            if (e.target === lightboxOverlay) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (lightboxOverlay.classList.contains('active')) {
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowLeft') showLightboxImage(currentImageIndex - 1);
                if (e.key === 'ArrowRight') showLightboxImage(currentImageIndex + 1);
            }
        });

        merchItemWrappers.forEach((itemWrapper, index) => {
            const name = itemWrapper.dataset.name;
            const description = itemWrapper.dataset.description;
            const captionElement = itemWrapper.querySelector('.merch-caption');
            const merchItem = itemWrapper.querySelector('.merch-item');

            if (captionElement) {
                captionElement.querySelector('.merch-name').textContent = name;
                const descriptionElement = captionElement.querySelector('.merch-description');
                if (descriptionElement && description) {
                    descriptionElement.textContent = description;
                }
            }
            
            if (merchItem && !merchItem.hasAttribute('data-static')) {
                merchItem.addEventListener('click', () => {
                    merchItem.classList.toggle('is-swapped');
                });
            }
            
            if (captionElement) {
                captionElement.addEventListener('click', () => {
                    openLightbox(index + 1);
                });
            }
        });
    }); 
    </script>
</body>
</html>
